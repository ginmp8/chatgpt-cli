name: CLI validation

on:
  push:
    branches:
      - main
      - feat/pandacode-codex-bridge
  pull_request:

permissions:
  contents: read

jobs:
  cli-tests:
    name: Python CLI and JSON-RPC contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI and test dependencies
        run: python -m pip install -e . pytest
      - name: Run tests without model account
        run: python -m pytest -q tests
      - name: Exercise installed entrypoint
        run: |
          chatgpt-cli --version
          chatgpt-cli --help
